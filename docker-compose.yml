version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: interview-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Polling is often needed for hot reloading in Docker, especially on non-Linux filesystems or specific setups
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    container_name: interview-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - qdrant
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/interview_agent
      - QDRANT_URL=http://qdrant:6333
      - FRONTEND_URL=http://localhost:5173

  db:
    image: postgres:15-alpine
    container_name: interview_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=interview_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  qdrant:
    image: qdrant/qdrant
    container_name: interview-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage:
